      /* ---- site/data/crops.js ---- */
// Reference thresholds per crop. `need` is the soil moisture below which the crop
// should be watered, in two units: volumetric % (demo data) and % saturation
// (NASA POWER GWETTOP). Values are rule-of-thumb guides for the demo, not agronomy advice.

const CROPS = {
  rice: { need: { vol: 40, sat: 75 }, method: 'drip', texture: 'rows' },
  coffee: { need: { vol: 28, sat: 55 }, method: 'drip', texture: 'trees' },
  veg: { need: { vol: 32, sat: 62 }, method: 'sprinkler', texture: 'beds' },
  fruit: { need: { vol: 30, sat: 58 }, method: 'drip', texture: 'trees' },
}

const CROP_IDS = Object.keys(CROPS)

/* ---- site/data/demo.js ---- */
// Demo farm: plot geometry, a week of simulated readings, a sample forecast and
// a sample watering log. Every value here is simulated for the presentation.

// Paddy outline: a rounded, slightly uneven polygon. `j` pulls each corner inward
// (x, y pairs clockwise from top-left) so no two plots are perfectly square.
function paddyPath(x, y, w, h, j) {
  const c = [
    [x + j[0], y + j[1]],
    [x + w - j[2], y + j[3]],
    [x + w - j[4], y + h - j[5]],
    [x + j[6], y + h - j[7]],
  ]
  const toward = (a, b, r) => {
    const dx = b[0] - a[0]
    const dy = b[1] - a[1]
    const len = Math.hypot(dx, dy)
    return `${(a[0] + (dx * r) / len).toFixed(1)} ${(a[1] + (dy * r) / len).toFixed(1)}`
  }
  let d = ''
  for (let i = 0; i < 4; i++) {
    const cur = c[i]
    d += `${i ? 'L' : 'M'}${toward(cur, c[(i + 3) % 4], 26)} Q${cur[0]} ${cur[1]} ${toward(cur, c[(i + 1) % 4], 26)} `
  }
  return `${d}Z`
}

// Geometry in the 1200×520 farm-plan viewBox. `flow` is the water path from the canal gate.
const PLOT_GEOMETRY = [
  { id: 'A', area: 0.6, x: 316, y: 118, w: 274, h: 182, j: [0, 8, 10, 0, 2, 0, 8, 10], flow: 'M600 90V209H578' },
  { id: 'B', area: 0.6, x: 610, y: 118, w: 274, h: 182, j: [4, 0, 0, 10, 8, 4, 0, 2], flow: 'M600 90V209H622' },
  { id: 'C', area: 0.6, x: 316, y: 322, w: 274, h: 168, j: [6, 0, 0, 6, 12, 0, 0, 8], flow: 'M600 90V406H578' },
  { id: 'D', area: 0.6, x: 610, y: 322, w: 274, h: 168, j: [0, 6, 8, 0, 0, 10, 10, 0], flow: 'M600 90V406H622' },
].map((p) => ({ ...p, d: paddyPath(p.x, p.y, p.w, p.h, p.j) }))

// Seven days ending today (index 6). Plot averages reproduce the headline numbers:
// 35% soil moisture and NDVI 0.68 today.
const DEMO_DAYS = ['2026-09-15', '2026-09-16', '2026-09-17', '2026-09-18', '2026-09-19', '2026-09-20', '2026-09-21']

/* ---- site/data/live.js ---- */
// Live data for one province: NASA POWER (soil wetness, rain, heat), Open-Meteo
// (7-day forecast) and, when reachable, MODIS NDVI from the ORNL DAAC subset service.
// Results are cached in localStorage so the page still works offline.

const FILL = -999

const ymd = (d) => d.toISOString().slice(0, 10).replaceAll('-', '')
const iso = (s) => `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}`

async function getJson(url, init) {
  const res = await fetch(url, init)
  if (!res.ok) throw new Error(`${res.status} ${url}`)
  return res.json()
}

async function fetchPower({ lat, lon }) {
  const end = new Date()
  const start = new Date(end.getTime() - 24 * 864e5)
  const url =
    'https://power.larc.nasa.gov/api/temporal/daily/point' +
    `?parameters=GWETTOP,GWETROOT,PRECTOTCORR,T2M_MAX&community=AG&latitude=${lat}&longitude=${lon}` +
    `&start=${ymd(start)}&end=${ymd(end)}&format=JSON`
  const json = await getJson(url)
  const p = json.properties.parameter
  const days = Object.keys(p.GWETTOP)
    .filter((k) => p.GWETTOP[k] !== FILL && p.PRECTOTCORR[k] !== FILL && p.T2M_MAX[k] !== FILL)
    .sort()
  if (days.length < 7) throw new Error('POWER returned too few days')
  return days.map((k) => ({
    date: iso(k),
    wet: p.GWETTOP[k], // 0–1 topsoil saturation
    root: p.GWETROOT[k] === FILL ? null : p.GWETROOT[k],
    rain: p.PRECTOTCORR[k], // mm/day
    tMax: p.T2M_MAX[k], // °C
  }))
}

async function fetchForecast({ lat, lon }) {
  const url =
    'https://api.open-meteo.com/v1/forecast' +
    `?latitude=${lat}&longitude=${lon}` +
    '&daily=temperature_2m_max,precipitation_sum,precipitation_probability_max&timezone=Asia%2FBangkok&forecast_days=8'
  const { daily } = await getJson(url)
  return daily.time.map((date, i) => ({
    date,
    tMax: Math.round(daily.temperature_2m_max[i]),
    rain: Math.round(daily.precipitation_sum[i] ?? 0),
    prob: daily.precipitation_probability_max[i] ?? 0,
  }))
}

// MODIS day-of-year date string, e.g. A2026264.
const modisDate = (d) => {
  const startOfYear = Date.UTC(d.getUTCFullYear(), 0, 0)
  const doy = Math.floor((d.getTime() - startOfYear) / 864e5)
  return `A${d.getUTCFullYear()}${String(doy).padStart(3, '0')}`
}

async function fetchNdvi({ lat, lon }) {
  const end = new Date()
  const start = new Date(end.getTime() - 64 * 864e5)
  const url =
    'https://modis.ornl.gov/rst/api/v1/MOD13Q1/subset' +
    `?latitude=${lat}&longitude=${lon}&band=250m_16_days_NDVI&startDate=${modisDate(start)}&endDate=${modisDate(end)}` +
    '&kmAboveBelow=1&kmLeftRight=1'
  const json = await getJson(url, { headers: { Accept: 'application/json' } })
  // A 3×3 km block of 250 m pixels; the median ignores roads, canals and houses.
  const rows = (json.subset || [])
    .map((r) => ({ date: r.calendar_date, px: (r.data || []).filter((v) => v > -3000).sort((a, b) => a - b) }))
    .filter((r) => r.px.length >= 9)
  if (!rows.length) throw new Error('No NDVI rows')
  const last = rows[rows.length - 1]
  const median = last.px[Math.floor(last.px.length / 2)]
  return { value: Math.round(median * 0.0001 * 100) / 100, date: last.date }
}

const cacheKey = (id) => `naf-live-${id}`

function readCachedLive(provinceId) {
  try {
    const raw = localStorage.getItem(cacheKey(provinceId))
    return raw ? JSON.parse(raw) : null
  } catch {
    return null
  }
}

/** Fetches everything for a province. POWER is required; forecast and NDVI are best-effort. */
async function fetchLive(province) {
  const [power, forecast, ndvi] = await Promise.allSettled([fetchPower(province), fetchForecast(province), fetchNdvi(province)])
  if (power.status !== 'fulfilled') throw power.reason
  const data = {
    fetchedAt: new Date().toISOString(),
    power: power.value,
    forecast: forecast.status === 'fulfilled' ? forecast.value : null,
    ndvi: ndvi.status === 'fulfilled' ? ndvi.value : null,
  }
  try {
    localStorage.setItem(cacheKey(province.id), JSON.stringify(data))
  } catch {
    /* storage full or blocked: live data still shows, it just won't survive offline */
  }
  return data
}

/* ---- site/logic/engine.js ---- */
// The one place where numbers become decisions. Every card, map colour, banner
// and advice text reads from `deriveFarm` and `planFor`.


const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v))
const round2 = (v) => Math.round(v * 100) / 100
const mean = (xs) => xs.reduce((s, x) => s + x, 0) / xs.length

function moistureStatus(m, need) {
  if (m < need * 0.75) return { key: 'veryLow', tone: 'bad' }
  if (m < need) return { key: 'low', tone: 'warn' }
  if (m <= need * 1.5) return { key: 'good', tone: 'good' }
  return { key: 'wet', tone: 'good' }
}

function ndviStatus(v) {
  if (v < 0.2) return { key: 'bare', tone: 'bad' }
  if (v < 0.4) return { key: 'sparse', tone: 'warn' }
  if (v < 0.6) return { key: 'fair', tone: 'warn' }
  return { key: 'good', tone: 'good' }
}

/** 0–4. Calibrated so the demo farm today (35% vs rice 40%, 9 dry days, 35°C, no rain due) is 2. */
function droughtLevel({ moisture, need, dryDays, rain48h, tMax }) {
  const deficit = Math.max(0, (need - moisture) / need)
  const score =
    deficit * 10 + (Math.min(dryDays, 14) / 14) * 4 + (tMax >= 35 ? 1 : tMax >= 33 ? 0.5 : 0) - (Math.min(rain48h, 20) / 20) * 3
  if (score < 1.5) return 0
  if (score < 3) return 1
  if (score < 5) return 2
  if (score < 7) return 3
  return 4
}

function dryStreaks(series) {
  let run = 0
  return series.map((d) => (run = d.rain < 1 ? run + 1 : 0))
}

/** Builds the 7-day picture (history + today) for either the demo farm or live NASA data. */
function baseSeries({ source, live }) {
  if (source === 'live' && live?.power) {
    const streak = dryStreaks(live.power)
    const last = live.power.slice(-7)
    const streakLast = streak.slice(-7)
    const f = live.forecast
    // Open-Meteo returns today first; the strip shows the 7 days after it.
    const forecast = f ? f.slice(1, 8) : null
    return {
      unit: 'sat',
      days: last.map((d) => d.date),
      plots: PLOT_GEOMETRY.map((g) => ({
        id: g.id,
        moisture: last.map((d) => clamp(Math.round(d.wet * 100 + PLOT_SPREAD[g.id] * 1.5), 5, 100)),
        ndvi: live.ndvi
          ? last.map(() => round2(clamp(live.ndvi.value + PLOT_SPREAD[g.id] * 0.004, 0, 1)))
          : DEMO_HISTORY[g.id].ndvi,
      })),
      weather: last.map((d, i) => ({ dryDays: streakLast[i], tMax: Math.round(d.tMax) })),
      rain48h: f ? Math.round((f[0]?.rain ?? 0) + (f[1]?.rain ?? 0)) : 0,
      forecast,
      ndviSimulated: !live.ndvi,
      ndviDate: live.ndvi?.date ?? null,
      dataDate: last[last.length - 1].date,
    }
  }
  return {
    unit: 'vol',
    days: DEMO_DAYS,
    plots: PLOT_GEOMETRY.map((g) => ({ id: g.id, ...DEMO_HISTORY[g.id] })),
    weather: DEMO_DAYS.map((_, i) => ({ dryDays: DEMO_WEATHER.dryDays[i], tMax: DEMO_WEATHER.tMax[i] })),
    rain48h: DEMO_FORECAST[0].rain + DEMO_FORECAST[1].rain,
    forecast: DEMO_FORECAST,
    ndviSimulated: true,
    dataDate: DEMO_DAYS[DEMO_DAYS.length - 1],
  }
}

/**
 * The whole farm for one day.
 * @param {{source:'demo'|'live', live:any, crop:string, day:number, scenario:null|{moisture:number,dryDays:number,rain48h:number,tMax:number}}} opts
 */
function deriveFarm({ source, live, crop, day, scenario }) {
  const base = baseSeries({ source, live })
  const need = CROPS[crop].need[base.unit]
  const last = base.days.length - 1
  const i = clamp(day ?? last, 0, last)
  const isToday = i === last

  const history = {
    moisture: base.days.map((_, d) => Math.round(mean(base.plots.map((p) => p.moisture[d])))),
    ndvi: base.days.map((_, d) => round2(mean(base.plots.map((p) => p.ndvi[d])))),
  }

  let weather = { ...base.weather[i], rain48h: isToday ? base.rain48h : 0 }
  let shift = 0
  if (scenario && isToday) {
    shift = scenario.moisture - history.moisture[i]
    weather = { dryDays: scenario.dryDays, tMax: scenario.tMax, rain48h: scenario.rain48h }
  }

  const plots = PLOT_GEOMETRY.map((g) => {
    const series = base.plots.find((p) => p.id === g.id)
    const moisture = clamp(series.moisture[i] + shift, 0, 100)
    const ndvi = series.ndvi[i]
    return {
      ...g,
      moisture,
      ndvi,
      level: droughtLevel({ moisture, need, ...weather }),
      mStatus: moistureStatus(moisture, need),
      nStatus: ndviStatus(ndvi),
    }
  })

  const avg = {
    moisture: Math.round(mean(plots.map((p) => p.moisture))),
    ndvi: round2(mean(plots.map((p) => p.ndvi))),
  }

  return {
    unit: base.unit,
    need,
    crop,
    days: base.days,
    dayIndex: i,
    isToday,
    plots,
    avg,
    weather,
    level: droughtLevel({ moisture: avg.moisture, need, ...weather }),
    forecast: base.forecast,
    history,
    ndviSimulated: base.ndviSimulated,
    ndviDate: base.ndviDate ?? null,
    dataDate: base.dataDate,
    whatIf: Boolean(scenario && isToday),
  }
}

const round5 = (v) => Math.round(v / 5) * 5

/** What to do on one plot today: water (with minutes and volume), wait for rain, or nothing. */
function planFor(plotId, farm) {
  const plot = farm.plots.find((p) => p.id === plotId)
  const rel = Math.max(0, (farm.need - plot.moisture) / farm.need)
  const minutes = clamp(round5(15 + 80 * rel + 4 * (farm.level - 1)), 15, 90)
  const method = CROPS[farm.crop].method
  const mm = minutes / 15
  const m3 = Math.round(mm * plot.area * 10)
  const flood = Math.round(m3 * 1.67)
  const nextRain = farm.forecast?.find((f) => f.rain >= 10) ?? null

  let type = 'water'
  if (rel === 0) type = 'fine'
  else if (farm.weather.rain48h >= 10) type = 'wait'

  return { type, plot, rel, minutes, start: 18 * 60, method, m3, flood, nextRain }
}

/** Plots that need water today, most urgent first. */
function farmPlans(farm) {
  return farm.plots.map((p) => planFor(p.id, farm)).sort((a, b) => b.rel - a.rel)
}

/* ---- site/logic/adviceText.js ---- */
// Turns an engine plan into plain words in the viewer's language.


const fmt = (n, lang, digits = 2) =>
  n.toLocaleString(T[lang].locale, { minimumFractionDigits: digits, maximumFractionDigits: digits })

const hhmm = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`

function dayLabel(isoDate, lang) {
  const d = new Date(`${isoDate}T00:00:00`)
  return `${T[lang].weekday[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`
}

const METHOD = {
  vi: { drip: { noun: 'tưới nhỏ giọt', verb: 'Tưới nhỏ giọt', term: 'drip' }, sprinkler: { noun: 'tưới phun mưa', verb: 'Tưới phun mưa', term: 'sprinkler' } },
  en: { drip: { noun: 'drip irrigation', verb: 'Drip irrigate', term: 'drip' }, sprinkler: { noun: 'sprinkler irrigation', verb: 'Run sprinklers on', term: 'sprinkler' } },
}

const methodInfo = (method, lang) => METHOD[lang][method]

function adviceText(plan, farm, lang) {
  const t = T[lang]
  const { plot, minutes } = plan
  const crop = t.crops[farm.crop]
  const cropLower = lang === 'vi' ? crop.toLowerCase() : crop.toLowerCase()
  const unit = farm.unit === 'sat' ? (lang === 'vi' ? '% bão hòa' : '% saturation') : '%'
  const m = `${plot.moisture}${unit}`
  const need = `${farm.need}${unit}`
  const risk = t.droughtLevels[farm.level]
  const ndvi = fmt(plot.ndvi, lang)
  const time = hhmm(plan.start)
  const meth = methodInfo(plan.method, lang)
  const { dryDays, tMax, rain48h } = farm.weather
  const rainDay = plan.nextRain ? dayLabel(plan.nextRain.date, lang) : null
  const nextCheck = lang === 'vi' ? 'khi có số liệu vệ tinh mới' : 'when new satellite data arrives'

  if (lang === 'vi') {
    if (plan.type === 'fine') {
      return {
        headline: `Thửa ${plot.id} chưa cần tưới`,
        summary: `Độ ẩm ${m} vẫn trên mức ${need} mà ${cropLower} cần. Kiểm tra lại sau 2 ngày để tiết kiệm nước.`,
        reasons: [
          { icon: 'drop', text: `Độ ẩm thửa ${plot.id} là ${m}, cao hơn mức ${need}.` },
          { icon: 'leaf', text: `NDVI ${ndvi}: cây ${plot.ndvi >= 0.6 ? 'khỏe' : 'cần theo dõi thêm'}.` },
          { icon: 'sun', text: `Rủi ro hạn hán: ${risk}.` },
        ],
        steps: ['Không mở van hôm nay.', `Kiểm tra lại độ ẩm sau 2 ngày hoặc ${nextCheck}.`],
      }
    }
    if (plan.type === 'wait') {
      return {
        headline: `Chưa tưới thửa ${plot.id}: chờ mưa ${rain48h} mm`,
        summary: `Dự báo có khoảng ${rain48h} mm mưa trong 48 giờ tới, đủ bù phần thiếu. Nếu mưa không tới, tưới ${minutes} phút lúc ${time} ngày mai.`,
        reasons: [
          { icon: 'drop', text: `Thửa ${plot.id} còn ${m}, dưới mức ${need} ${cropLower} cần.` },
          { icon: 'cloud', text: `Dự báo mưa ${rain48h} mm trong 48 giờ tới.`, term: 'forecast' },
          { icon: 'sun', text: `Rủi ro hạn hán: ${risk}.` },
        ],
        steps: ['Khơi thông rãnh thoát nước để tránh úng khi mưa lớn.', `Sáng mai xem lại dự báo; nếu không mưa, tưới ${minutes} phút lúc ${time}.`],
      }
    }
    return {
      headline: `${meth.verb} thửa ${plot.id} trong ${minutes} phút, lúc ${time} chiều nay`,
      summary:
        farm.level >= 2
          ? `Độ ẩm đất thấp và rủi ro hạn hán tăng. Khuyên dùng: ${meth.noun} ${minutes} phút vào lúc ${time} chiều nay để tiết kiệm nước.`
          : `Độ ẩm đất thấp hơn mức ${cropLower} cần. Khuyên dùng: ${meth.noun} ${minutes} phút vào lúc ${time} chiều nay.`,
      reasons: [
        { icon: 'drop', text: `Thửa ${plot.id} chỉ còn ${m}, dưới mức ${need} mà ${cropLower} cần (cả ruộng trung bình ${farm.avg.moisture}${unit}).` },
        {
          icon: 'sun',
          text: dryDays > 0 ? `Rủi ro hạn hán ${risk}: ${dryDays} ngày chưa có mưa, nắng nóng tới ${tMax}°C.` : `Rủi ro hạn hán ${risk}, nắng tới ${tMax}°C.`,
        },
        { icon: 'leaf', text: `NDVI ${ndvi}: ${plot.ndvi >= 0.6 ? 'cây vẫn khỏe, tưới ngay giúp giữ năng suất.' : 'cây bắt đầu yếu đi, nên tưới sớm.'}` },
        {
          icon: 'cloud',
          text: `48 giờ tới gần như không mưa (${rain48h} mm)${rainDay ? `; mưa lớn dự kiến ${rainDay}.` : '.'}`,
          term: 'forecast',
        },
        { icon: 'clock', text: `Tưới lúc ${time} tránh giờ bốc hơi mạnh nhất (11:00–15:00).`, term: 'et' },
      ],
      steps: [
        plan.method === 'sprinkler'
          ? `Kiểm tra béc phun ở thửa ${plot.id}: phun đều, không nghẹt.`
          : `Kiểm tra ống nhỏ giọt ở thửa ${plot.id}: không tắc, không rò.`,
        `Mở van lúc ${time}, tưới ${minutes} phút rồi đóng van.`,
        `Sáng mai xem lại độ ẩm đất ${nextCheck}.`,
      ],
    }
  }

  if (plan.type === 'fine') {
    return {
      headline: `Plot ${plot.id} doesn't need water yet`,
      summary: `Moisture is ${m}, still above the ${need} ${cropLower} needs. Check again in 2 days to save water.`,
      reasons: [
        { icon: 'drop', text: `Plot ${plot.id} is at ${m}, above ${need}.` },
        { icon: 'leaf', text: `NDVI ${ndvi}: plants ${plot.ndvi >= 0.6 ? 'are healthy' : 'need watching'}.` },
        { icon: 'sun', text: `Drought risk: ${risk}.` },
      ],
      steps: ["Don't open the valve today.", `Check moisture again in 2 days or ${nextCheck}.`],
    }
  }
  if (plan.type === 'wait') {
    return {
      headline: `Hold off on plot ${plot.id}: ${rain48h} mm of rain is coming`,
      summary: `About ${rain48h} mm of rain is forecast in the next 48 hours, enough to cover the shortfall. If it doesn't come, water for ${minutes} minutes at ${time} tomorrow.`,
      reasons: [
        { icon: 'drop', text: `Plot ${plot.id} is at ${m}, below the ${need} ${cropLower} needs.` },
        { icon: 'cloud', text: `${rain48h} mm of rain forecast in the next 48 hours.`, term: 'forecast' },
        { icon: 'sun', text: `Drought risk: ${risk}.` },
      ],
      steps: ['Clear the drainage channels so heavy rain does not flood the plot.', `Check the forecast tomorrow morning; if no rain, water ${minutes} minutes at ${time}.`],
    }
  }
  return {
    headline: `${meth.verb} plot ${plot.id} for ${minutes} minutes at ${time} this evening`,
    summary:
      farm.level >= 2
        ? `Soil moisture is low and drought risk is rising. Recommended: ${meth.noun} for ${minutes} minutes at ${time} this evening to save water.`
        : `Soil moisture is below what ${cropLower} needs. Recommended: ${meth.noun} for ${minutes} minutes at ${time} this evening.`,
    reasons: [
      { icon: 'drop', text: `Plot ${plot.id} is down to ${m}, below the ${need} ${cropLower} needs (farm average ${farm.avg.moisture}${unit}).` },
      {
        icon: 'sun',
        text: dryDays > 0 ? `Drought risk is ${risk}: no rain for ${dryDays} days, heat up to ${tMax}°C.` : `Drought risk is ${risk}, highs of ${tMax}°C.`,
      },
      { icon: 'leaf', text: `NDVI ${ndvi}: ${plot.ndvi >= 0.6 ? 'plants are still healthy, so watering now protects the yield.' : 'plants are starting to weaken; water soon.'}` },
      {
        icon: 'cloud',
        text: `Almost no rain in the next 48 hours (${rain48h} mm)${rainDay ? `; heavy rain expected ${rainDay}.` : '.'}`,
        term: 'forecast',
      },
      { icon: 'clock', text: `Watering at ${time} avoids the hours of strongest evaporation (11:00–15:00).`, term: 'et' },
    ],
    steps: [
      plan.method === 'sprinkler'
        ? `Check the sprinkler heads in plot ${plot.id}: even spray, no clogs.`
        : `Check the drip lines in plot ${plot.id}: no blockages, no leaks.`,
      `Open the valve at ${time}, water for ${minutes} minutes, then close it.`,
      `Check soil moisture again tomorrow morning ${nextCheck}.`,
    ],
  }
}

/** One line for the top banner, covering the whole farm. */
function bannerText(plans, farm, lang) {
  const water = plans.filter((p) => p.type === 'water')
  const wait = plans.filter((p) => p.type === 'wait')
  const time = hhmm(18 * 60)
  if (water.length) {
    const [first, ...rest] = water
    const meth = methodInfo(first.method, lang)
    const others = rest.map((p) => `${p.plot.id} ${p.minutes}′`).join(', ')
    return lang === 'vi'
      ? `${meth.verb} thửa ${first.plot.id} · ${first.minutes} phút · ${time}${others ? `  (thêm ${others})` : ''}`
      : `${meth.verb} plot ${first.plot.id} · ${first.minutes} min · ${time}${others ? `  (also ${others})` : ''}`
  }
  if (wait.length) {
    return lang === 'vi'
      ? `Chờ mưa: dự báo ${farm.weather.rain48h} mm trong 48 giờ tới, chưa cần tưới`
      : `Wait for rain: ${farm.weather.rain48h} mm forecast in 48 hours, no watering yet`
  }
  return lang === 'vi' ? 'Ruộng đủ ẩm, hôm nay chưa cần tưới' : 'Soil is moist enough; no watering needed today'
}

/* ---- site/logic/assistantFallback.js ---- */
// Answers built from the dashboard numbers, used when the AI model is not
// reachable (no API key, offline, or an error). Keeps the chat useful in any demo.


function fallbackAnswer(question, { farm, plans, selectedText }, lang) {
  const q = question.toLowerCase()
  const t = T[lang]
  const vi = lang === 'vi'
  const crop = t.crops[farm.crop].toLowerCase()
  const driest = [...farm.plots].sort((a, b) => a.moisture - b.moisture)[0]
  const wettest = [...farm.plots].sort((a, b) => b.moisture - a.moisture)[0]
  const rainDay = farm.forecast?.find((f) => f.rain >= 10)
  const rainText = rainDay ? dayLabel(rainDay.date, lang) : null
  const has = (...words) => words.some((w) => q.includes(w))

  if (has('bón', 'phân', 'fertil')) {
    const dry = farm.avg.moisture < farm.need
    return vi
      ? `${dry ? `Đất đang khô (${farm.avg.moisture}% so với mức ${farm.need}% ${crop} cần), nên chưa bón phân: rễ khó hút và dễ bị cháy lá. Hãy tưới trước, bón sau 1–2 ngày khi đất đủ ẩm.` : 'Độ ẩm đất đang đủ, có thể bón phân.'}${rainText ? ` Tránh bón ngay trước đợt mưa lớn ${rainText} để phân không bị rửa trôi.` : ''} Nếu cần liều lượng cụ thể, hãy hỏi cán bộ khuyến nông địa phương.`
      : `${dry ? `The soil is dry (${farm.avg.moisture}% vs the ${farm.need}% ${crop} needs), so hold off on fertiliser: roots can't take it up and leaves may burn. Water first, then fertilise 1–2 days later.` : 'Soil moisture is adequate, so fertilising is fine.'}${rainText ? ` Avoid fertilising right before the heavy rain on ${rainText}, or it will wash away.` : ''} For exact doses, ask your local extension officer.`
  }

  if (has('vì sao', 'tại sao', 'why', 'khô hơn', 'drier')) {
    return vi
      ? `Thửa ${driest.id} khô nhất (${driest.moisture}%), còn thửa ${wettest.id} ẩm nhất (${wettest.moisture}%). Chênh lệch thường do vị trí xa cống, đất giữ nước kém hơn, hoặc ống tưới bị rò. NDVI thửa ${driest.id} là ${fmt(driest.ndvi, lang)}, thấp hơn các thửa khác, cho thấy cây đã bắt đầu thiếu nước. Nên kiểm tra ống nhỏ giọt và bờ ruộng ở thửa này trước.`
      : `Plot ${driest.id} is the driest (${driest.moisture}%) and plot ${wettest.id} the wettest (${wettest.moisture}%). Gaps like this usually come from distance to the gate, soil that holds less water, or a leaking line. Plot ${driest.id}'s NDVI is ${fmt(driest.ndvi, lang)}, lower than the others, so the plants are starting to feel it. Check its drip lines and bunds first.`
  }

  if (has('mưa', 'rain', 'dự báo', 'forecast', 'thời tiết', 'weather')) {
    return vi
      ? `48 giờ tới dự báo ${farm.weather.rain48h} mm mưa. ${rainText ? `Đợt mưa lớn đầu tiên dự kiến ${rainText} (${rainDay.rain} mm).` : 'Chưa thấy đợt mưa lớn nào trong 7 ngày tới.'} Nhiệt độ cao nhất hôm nay khoảng ${farm.weather.tMax}°C.`
      : `${farm.weather.rain48h} mm of rain is forecast in the next 48 hours. ${rainText ? `The first heavy rain is expected ${rainText} (${rainDay.rain} mm).` : 'No heavy rain in the next 7 days.'} Today's high is about ${farm.weather.tMax}°C.`
  }

  if (has('ndvi', 'xanh', 'green', 'khỏe', 'health')) {
    return vi
      ? `NDVI trung bình là ${fmt(farm.avg.ndvi, lang)}: ${farm.avg.ndvi >= 0.6 ? 'cây xanh và khỏe' : 'cây đang yếu đi'}. NDVI đo độ xanh của lá từ ảnh vệ tinh MODIS; trên 0,6 là tốt. Thửa ${driest.id} thấp nhất với ${fmt(driest.ndvi, lang)}.`
      : `Average NDVI is ${fmt(farm.avg.ndvi, lang)}: ${farm.avg.ndvi >= 0.6 ? 'plants are green and healthy' : 'plants are weakening'}. NDVI measures leaf greenness from MODIS satellite images; above 0.6 is good. Plot ${driest.id} is lowest at ${fmt(driest.ndvi, lang)}.`
  }

  if (has('hạn', 'drought')) {
    return vi
      ? `Rủi ro hạn hán đang ở mức ${t.droughtLevels[farm.level]} (${farm.level + 1}/5): ${farm.weather.dryDays} ngày chưa có mưa, nắng tới ${farm.weather.tMax}°C, độ ẩm trung bình ${farm.avg.moisture}% so với mức ${farm.need}% cần.`
      : `Drought risk is ${t.droughtLevels[farm.level]} (${farm.level + 1}/5): ${farm.weather.dryDays} days without rain, highs of ${farm.weather.tMax}°C, average moisture ${farm.avg.moisture}% vs ${farm.need}% needed.`
  }

  if (has('tưới', 'water', 'irrigat', 'tối nay', 'tonight')) {
    return `${bannerText(plans, farm, lang)}. ${selectedText.summary}`
  }

  return vi
    ? `Tóm tắt hôm nay: ${bannerText(plans, farm, lang)}. Bạn có thể hỏi về tưới nước, mưa, NDVI, hạn hán hoặc bón phân.`
    : `Today in short: ${bannerText(plans, farm, lang)}. You can ask about watering, rain, NDVI, drought or fertiliser.`
}

/** Compact snapshot of the dashboard for the AI model's instructions. */
function assistantContext({ farm, plans, source, provinceName }) {
  return {
    mode: source === 'live' ? `live NASA POWER data, ${provinceName}` : 'demo farm (simulated data)',
    crop: farm.crop,
    moistureUnit: farm.unit === 'sat' ? '% saturation (GWETTOP)' : '% volumetric',
    cropNeeds: farm.need,
    dataDate: farm.dataDate,
    averages: farm.avg,
    droughtLevel: `${farm.level + 1}/5`,
    weather: farm.weather,
    plots: farm.plots.map((p) => ({ id: p.id, moisture: p.moisture, ndvi: p.ndvi, droughtLevel: p.level + 1 })),
    forecast: farm.forecast,
    todaysPlan: plans.map((p) => ({ plot: p.plot.id, action: p.type, minutes: p.type === 'water' ? p.minutes : 0, at: '18:00' })),
    ndviSimulated: farm.ndviSimulated,
  }
}

      const todayIso = () => new Date().toLocaleDateString('sv-SE')
      const store = {
        get(k, d, ok) {
          try {
            const raw = localStorage.getItem(k)
            if (raw == null) return d
            const v = JSON.parse(raw)
            return ok(v) ? v : d
          } catch {
            return d
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, JSON.stringify(v))
          } catch {
            /* storage unavailable: the page still works, it just won't remember */
          }
        },
      }

      /* ================================================================
       * State
       * ================================================================ */
      const S = {
        lang: store.get('naf-lang', 'vi', (v) => v === 'vi' || v === 'en'),
        source: store.get('naf-source', 'demo', (v) => v === 'demo' || v === 'live'),
        provinceId: store.get('naf-province', 'cantho', (v) => PROVINCES.some((p) => p.id === v)),
        crop: store.get('naf-crop', 'rice', (v) => CROP_IDS.includes(v)),
        log: store.get('naf-log', SEED_LOG, Array.isArray),
        layer: 'moisture',
        day: null,
        playing: false,
        selected: 'B',
        scenario: null,
        preset: null,
        showAdvice: false,
        flowing: null,
        live: { status: 'idle', data: null },
        signK: 1,
        flowShown: null,
        chat: [],
        busy: false,
        dialog: null, // 'share' | 'assistant'
      }
      let D

      function derive() {
        const eff = S.source === 'live' && S.live.data ? 'live' : 'demo'
        const base = { source: eff, live: S.live.data, crop: S.crop }
        const farm = deriveFarm({ ...base, day: S.day, scenario: S.scenario })
        const nowFarm = farm.isToday ? farm : deriveFarm({ ...base, day: null, scenario: S.scenario })
        const realToday = deriveFarm({ ...base, day: null, scenario: null })
        const plans = farmPlans(nowFarm)
        const byId = Object.fromEntries(plans.map((p) => [p.plot.id, p]))
        const plan = byId[S.selected]
        return { eff, farm, nowFarm, realToday, plans, byId, plan, text: adviceText(plan, nowFarm, S.lang) }
      }
      const t = () => T[S.lang]
      const l = () => L[S.lang]

      /* ================================================================
       * Shared pieces
       * ================================================================ */
      const term = (id, label, cls = '') =>
        `<button type="button" data-term="${id}" class="cursor-help rounded-sm text-left underline decoration-current/40 decoration-dotted decoration-2 underline-offset-[5px] transition-colors hover:decoration-lime-500 ${cls}">${label}${icon('info', 'ml-1 inline size-[0.8em] -translate-y-px opacity-60')}</button>`

      const pillBtn = (label, attrs = '', tone = 'lime') => {
        const tones = {
          lime: 'bg-lime-400 text-moss-950 hover:bg-lime-300',
          outline: 'border border-white/60 text-white hover:bg-white/10',
          dark: 'bg-moss-900 text-white hover:bg-moss-800',
          ghost: 'border border-line bg-white text-ink hover:border-moss-700',
        }
        return `<button type="button" ${attrs} class="inline-flex items-center gap-2 rounded-full px-5 py-3 text-[15px] font-bold transition-all duration-300 hover:-translate-y-0.5 ${tones[tone]}">${label}</button>`
      }

      function segmented(name, value, options, { dark = false, size = 'md' } = {}) {
        const pad = size === 'sm' ? 'px-3 py-1.5 text-[13px] max-sm:px-2.5 max-sm:text-xs' : 'px-4 py-2 text-sm'
        const shell = dark ? 'border-white/25 bg-white/10' : 'border-line bg-white'
        const idle = dark ? 'text-white/80 hover:text-white' : 'text-muted hover:text-ink'
        return `<div role="group" class="flex rounded-full border p-1 ${shell}">${options
          .map(
            (o) =>
              `<button type="button" data-action="${name}" data-value="${o.value}" aria-pressed="${value === o.value}" class="whitespace-nowrap rounded-full font-bold transition-colors duration-300 ${pad} ${idle} aria-pressed:bg-moss-900 aria-pressed:text-white">${o.label}</button>`,
          )
          .join('')}</div>`
      }

      function selectBox(name, label, value, options, iconName) {
        return `<label class="relative flex items-center rounded-full border border-line bg-white transition-colors focus-within:border-moss-700 hover:border-moss-700">
          <span class="sr-only">${label}</span>
          ${icon(iconName, 'pointer-events-none absolute left-3.5 size-4 text-moss-700')}
          <select data-select="${name}" class="appearance-none rounded-full bg-transparent py-2 pl-10 pr-9 text-sm font-bold text-ink outline-none">
            ${options.map((o) => `<option value="${o.value}" ${o.value === value ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
          </select>
          ${icon('chevron-down', 'pointer-events-none absolute right-3 size-4 text-muted')}
        </label>`
      }

      const TONE = {
        good: ['bg-lime-100 text-moss-900', 'check'],
        warn: ['bg-sun-100 text-sun-700', 'triangle-alert'],
        bad: ['bg-clay-100 text-clay-700', 'circle-alert'],
      }
      const badge = (tone, text) => `<span class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-sm font-bold ${TONE[tone][0]}">${icon(TONE[tone][1], 'size-4')}${text}</span>`

      const whatIfTag = () =>
        `<span class="rounded-full border border-dashed border-sun-400 bg-sun-100 px-2.5 py-0.5 text-xs font-bold text-sun-700">${t().whatIfTag}</span>`

      /* ================================================================
       * Nav
       * ================================================================ */
      function renderNav() {
        const L_ = l()
        const link = (href, label) =>
          `<a href="${href}" class="rounded-full px-3 py-2 text-sm font-semibold text-white/85 transition-colors hover:text-white group-data-[solid=true]:text-muted group-data-[solid=true]:hover:text-ink">${label}</a>`
        $('#nav').innerHTML = `
          <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-4 sm:px-8">
            <a href="#hero" class="flex items-center gap-2.5 text-white group-data-[solid=true]:text-moss-950" aria-label="NASA Adapting Farms">
              <span class="grid size-9 place-items-center rounded-full bg-lime-400 text-moss-950">${icon('sprout', 'size-5')}</span>
              <span class="text-[15px] font-extrabold tracking-tight">NASA Adapting Farms</span>
            </a>
            <div class="hidden items-center gap-1 lg:flex">
              ${link('#dashboard', L_.navDash)}${link('#solutions', L_.navSolutions)}${link('#weather', L_.navWeather)}${link('#farmers', L_.navFarmers)}
            </div>
            <div class="flex items-center gap-2">
              <div role="group" aria-label="${t().langLabel}" class="flex rounded-full border border-white/40 p-0.5 group-data-[solid=true]:border-line">
                ${['vi', 'en']
                  .map(
                    (v) =>
                      `<button type="button" data-action="lang" data-value="${v}" aria-pressed="${S.lang === v}" class="rounded-full px-3 py-1.5 text-[13px] font-bold text-white/85 transition-colors group-data-[solid=true]:text-muted aria-pressed:bg-lime-400 aria-pressed:text-moss-950 group-data-[solid=true]:aria-pressed:text-moss-950">${v.toUpperCase()}</button>`,
                  )
                  .join('')}
              </div>
              <a href="#contact" class="hidden rounded-full bg-white px-4 py-2 text-sm font-bold text-moss-950 transition-all duration-300 hover:-translate-y-0.5 hover:bg-lime-400 sm:inline-flex group-data-[solid=true]:bg-moss-900 group-data-[solid=true]:text-white group-data-[solid=true]:hover:bg-moss-800">${L_.contact}</a>
            </div>
          </nav>`
      }

      /* ================================================================
       * Hero + stats + mission
       * ================================================================ */
      function renderHero() {
        const L_ = l()
        $('#hero').innerHTML = `
          <div class="absolute inset-0 -z-10 bg-moss-800">
            ${photo('hero', 2000, 'hero-photo size-full object-cover saturate-[.8]', '')}
          </div>
          <div class="absolute inset-0 -z-10 bg-moss-950/35"></div>
          <div class="absolute inset-0 -z-10 bg-gradient-to-r from-moss-950/75 via-moss-950/35 to-moss-950/5"></div>
          <div class="absolute inset-0 -z-10 bg-gradient-to-b from-moss-950/60 via-transparent to-moss-950/80"></div>
          <div class="mx-auto w-full max-w-6xl px-5 sm:px-8">
            <div class="max-w-2xl" data-reveal>
              <h1 class="text-[2.6rem] font-extrabold leading-[1.05] tracking-tight sm:text-6xl lg:text-7xl [@media(min-width:640px)_and_(max-height:780px)]:text-5xl">${L_.heroTitle}</h1>
              <p class="mt-5 max-w-xl text-lg leading-relaxed text-white/80">${L_.heroSub}</p>
              <div class="mt-8 flex flex-wrap gap-3">
                ${pillBtn(`${L_.partnership}${icon('arrow-up-right', 'size-4')}`, 'data-action="goto" data-value="contact"', 'lime')}
                ${pillBtn(L_.meetFarmers, 'data-action="goto" data-value="farmers"', 'outline')}
              </div>
            </div>
            <div class="mt-12 flex flex-wrap items-end justify-between gap-6 [@media(max-height:780px)]:mt-7" data-reveal style="transition-delay:180ms">
              <div id="hero-chip" class="max-w-xl"></div>
              <a href="#stats" aria-label="${L_.scrollDown}" class="hidden size-12 place-items-center rounded-full border border-white/40 text-white transition-all duration-300 hover:bg-white/10 sm:grid">${icon('arrow-down', 'size-5')}</a>
            </div>
          </div>`
      }

      // Only the chip changes with the numbers, so the hero photo never reloads.
      function renderHeroChip() {
        const top = D.plans[0]
        const glyph = top.type === 'water' ? 'droplets' : top.type === 'wait' ? 'cloud-rain' : 'check'
        $('#hero-chip').innerHTML = `
          <button type="button" data-action="open-advice" data-value="${top.plot.id}" class="flex items-center gap-3 rounded-full border border-white/25 bg-white/10 py-2 pl-2 pr-5 text-left backdrop-blur-md transition-all duration-300 hover:-translate-y-0.5 hover:bg-white/20">
            <span class="grid size-10 shrink-0 place-items-center rounded-full bg-lime-400 text-moss-950">${icon(glyph, 'size-5')}</span>
            <span class="text-[15px] font-semibold leading-snug"><span class="text-lime-300">${t().today}:</span> ${bannerText(D.plans, D.nowFarm, S.lang)}</span>
          </button>`
      }

      function renderStats() {
        $('#stats').innerHTML = `
          <div class="mx-auto grid max-w-6xl grid-cols-2 gap-x-6 gap-y-8 px-5 py-9 sm:px-8 lg:grid-cols-4">
            ${l()
              .stats.map(
                (s, i) => `
              <div data-reveal style="transition-delay:${i * 90}ms">
                <p class="tabular whitespace-nowrap font-extrabold tracking-tight ${s.text ? 'text-[2.4rem] sm:text-6xl' : 'text-5xl sm:text-6xl'}">
                  ${s.text ? s.text : `<span data-count="${s.value}">${s.value}</span>`}${s.unit ? `<span class="text-3xl font-bold text-lime-400 sm:text-4xl">${s.unit}</span>` : ''}
                </p>
                <p class="mt-3 text-[15px] font-semibold text-white">${s.label}</p>
                <p class="mt-0.5 text-sm text-moss-100/70">${s.note}</p>

              )
              .join('')}
          </div>`
      }

      function renderMission() {
        const L_ = l()
        const words = (s, cls = 'word') => s.split(' ').map((w) => `<span class="${cls}">${w}</span>`).join(' ')
        $('#mission').innerHTML = `
          <p class="max-w-5xl text-[1.7rem] font-bold leading-[1.3] tracking-tight sm:text-4xl sm:leading-[1.25]" data-mission>
            ${words(L_.missionA)}
            <span class="relative mx-1 inline-block h-[0.9em] w-[2.4em] translate-y-[0.1em] overflow-hidden rounded-full bg-moss-700 align-baseline">${photo('house', 400, 'size-full object-cover')}</span>
            ${words(L_.missionB, 'word soft')}
          </p>`
      }

      /* ================================================================
       * Farm plan (SVG)
       * ================================================================ */
      /* Modern "digital farm" plan: dark moss ground with a survey grid, glossy plots that
         cast soft shadows, floating data chips, a glowing selection and a glowing water line. */
      const DROUGHT = ['#7ccf45', '#c9cf52', '#f2b134', '#e07b2a', '#d9552f']
      const PLOT_FILL = {
        moisture: { good: '#7ccf45', wet: '#7ccf45', low: '#bfd154', veryLow: '#dccb8c' },
        ndvi: (v) => (v > 0.65 ? '#3fae4a' : v >= 0.55 ? '#9fd55a' : '#dccb8c'),
      }
      function plotLook(p) {
        if (S.layer === 'ndvi') return { fill: PLOT_FILL.ndvi(p.ndvi), over: '' }
        if (S.layer === 'drought') return { fill: DROUGHT[p.level], over: p.level >= 3 ? 'url(#hatch)' : '' }
        const k = p.mStatus.key
        return { fill: PLOT_FILL.moisture[k], over: k === 'veryLow' ? 'url(#dryDense)' : k === 'low' ? 'url(#drySparse)' : '' }
      }
      // This page draws the plots wider than the shared geometry (about 72% of the canvas).
      const LAYOUT = {
        A: { x: 170, y: 120, w: 420, h: 175, flow: 'M600 90V207H578' },
        B: { x: 610, y: 120, w: 420, h: 175, flow: 'M600 90V207H622' },
        C: { x: 170, y: 318, w: 420, h: 175, flow: 'M600 90V405H578' },
        D: { x: 610, y: 318, w: 420, h: 175, flow: 'M600 90V405H622' },
      }
      // Flat, low-contrast canopy clusters at the edges: context, not decoration.
      const GROVES = [
        [58, 150, 30], [96, 128, 22], [70, 300, 36], [108, 332, 24], [62, 450, 30], [100, 478, 20],
        [1138, 160, 32], [1100, 136, 20], [1130, 300, 26], [1146, 440, 34], [1106, 470, 22],
        // tree line along the bottom edge, inside the phone view of the map
        [186, 548, 22], [236, 560, 16], [312, 552, 24], [388, 562, 15], [468, 550, 21], [548, 561, 14],
        [652, 551, 22], [726, 562, 15], [800, 549, 24], [880, 560, 17], [958, 551, 22], [1020, 562, 14],
      ]
      // Tree canopies: solid green with a lighter crown and a soft shadow, so they read clearly on the dark ground.
      const grove = ([x, y, r]) =>
        `<circle cx="${x + r * 0.12}" cy="${y + r * 0.2}" r="${r}" fill="#000" opacity=".22"/>` +
        `<circle cx="${x}" cy="${y}" r="${r}" fill="#3f9a4a"/>` +
        `<circle cx="${x - r * 0.22}" cy="${y - r * 0.24}" r="${r * 0.58}" fill="#6cc25a"/>`
      const RAIN = Array.from({ length: 70 }, (_, i) => [((i * 173) % 1200) - 20, ((i * 97) % 520) - 40, 0.2 + ((i * 37) % 10) / 20])

      function farmSvg() {
        const { farm } = D
        const T_ = t()
        const W = wide()
        const k = S.signK
        const texture = CROPS[farm.crop].texture
        const plans = farm.isToday ? D.byId : null
        const flagged = S.log.filter((e) => e.date === todayIso() && e.status === 'planned').map((e) => e.plot)

        const plots = farm.plots
          .map((src) => {
            const p = { ...src, ...LAYOUT[src.id] }
            const sel = S.selected === p.id
            const wet = S.flowing === p.id
            const look = plotLook(p)
            const compact = k > 1.15
            const main = S.layer === 'ndvi' ? fmt(p.ndvi, S.lang) : S.layer === 'drought' ? `${p.level + 1}/5` : `${p.moisture}%`
            const sub = S.layer === 'ndvi' ? `${T_.layers.moisture} ${p.moisture}%` : `NDVI ${fmt(p.ndvi, S.lang)}`
            // Every plot that needs water shows its chip at every size; on phones the unselected ones are short.
            const full = plans?.[p.id]
            const short = !W && !sel
            const pl = full && !(short && full.type === 'fine') ? full : null
            const action = pl
              ? pl.type === 'water'
                ? short
                  ? `${pl.minutes}′`
                  : `${hhmm(pl.start)} · ${pl.minutes}′`
                : T_.plotNeed[pl.type]
              : ''
            const cw = compact ? 132 : 176
            const ch = compact ? 44 : 60
            // Word pills ("No watering needed") grow with their text so it never runs past the pill.
            const aw = short && pl?.type === 'water' ? 84 : compact ? (pl && pl.type !== 'water' ? Math.max(150, Math.round(action.length * 9.5 + 26)) : 150) : Math.max(176, Math.round(action.length * 9 + 24))
            const actionFill = pl ? (pl.type === 'water' ? '#b8e55a' : pl.type === 'wait' ? '#8cc0e3' : '#ffffff') : ''
            const r = 26
            return `
              <g role="button" tabindex="0" data-plot="${p.id}" aria-pressed="${sel}" aria-label="${T_.plot} ${p.id}: ${p.moisture}% · NDVI ${fmt(p.ndvi, S.lang)} · ${T_.status[p.mStatus.key]}" class="cursor-pointer outline-none">
                ${sel ? `<rect x="${p.x - 7}" y="${p.y - 7}" width="${p.w + 14}" height="${p.h + 14}" rx="${r + 7}" fill="none" stroke="#b8e55a" stroke-width="5" filter="url(#glow)" class="sel-ring"/>` : ''}
                <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="${wet && S.layer === 'moisture' ? '#62c04a' : look.fill}" filter="url(#lift)" style="transition:fill .5s"/>
                <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="url(#${texture})"/>
                ${!wet && look.over ? `<rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="${look.over}"/>` : ''}
                <rect class="wet-overlay" data-wet="${p.id}" data-on="${wet && S.flowShown === p.id}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="url(#sheen)"/>
                <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="${r}" fill="url(#gloss)"/>
                <rect x="${p.x + 1.5}" y="${p.y + 1.5}" width="${p.w - 3}" height="${p.h - 3}" rx="${r - 1.5}" fill="none" stroke="#fff" stroke-opacity="${sel ? 0.55 : 0.28}" stroke-width="2"/>
                <g transform="translate(${p.x + (k > 1.6 ? 10 : 16)} ${p.y + (k > 1.6 ? 8 : 16)}) scale(${k})">
                  <rect x="0" y="4" width="${cw}" height="${ch}" rx="${ch / 2}" fill="#000" opacity=".18"/>
                  <rect width="${cw}" height="${ch}" rx="${ch / 2}" fill="#fff"/>
                  <circle cx="${ch / 2}" cy="${ch / 2}" r="${ch / 2 - 6}" fill="${sel ? '#b8e55a' : '#0b2e1b'}"/>
                  <text x="${ch / 2}" y="${ch / 2 + 6.5}" fill="${sel ? '#0b2e1b' : '#fff'}" font-size="${compact ? 17 : 19}" font-weight="800" text-anchor="middle">${p.id}</text>
                  <text x="${ch + 2}" y="${compact ? 30 : 29}" fill="#10231a" font-size="${compact ? 23 : 25}" font-weight="800" class="tabular">${main}</text>
                  ${compact ? '' : `<text x="${ch + 2}" y="48" fill="#5a6b61" font-size="14" font-weight="600" class="tabular">${sub}</text>`}
                  ${
                    pl
                      ? `<g transform="translate(0 ${ch + 8})"><rect width="${aw}" height="30" rx="15" fill="${actionFill}"/>${
                          pl.type === 'water' ? `<path d="M19 8c-3.5 4.4-5.2 7.3-5.2 9.2a5.2 5.2 0 0 0 10.4 0c0-1.9-1.7-4.8-5.2-9.2z" fill="#0b2e1b"/>` : ''
                        }<text x="${pl.type === 'water' ? 32 : aw / 2}" y="${short ? 21.5 : 20.5}" font-size="${short ? 18 : 15}" font-weight="800" fill="#0b2e1b" text-anchor="${pl.type === 'water' ? 'start' : 'middle'}" class="tabular">${action}</text></g>`
                      : ''
                  }
                </g>
                ${
                  flagged.includes(p.id)
                    ? `<g class="pop-in" transform="translate(${p.x + p.w - 30} ${p.y + p.h - 30})"><circle r="17" fill="#b8e55a" stroke="#0b2e1b" stroke-width="3"/><path d="M-7 0l4.5 4.5L7-5" fill="none" stroke="#0b2e1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>`
                    : ''
                }
              </g>`
          })
          .join('')

        const flows = farm.plots
          .map(
            (p) =>
              `<g pointer-events="none"><path class="flow-path" data-flow="${p.id}" data-on="${S.flowing === p.id && S.flowShown === p.id}" d="${LAYOUT[p.id].flow}" fill="none" stroke="#8cc0e3" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#waterGlow)"/>${
                S.flowing === p.id && S.flowShown === p.id ? `<path class="water-run" d="${LAYOUT[p.id].flow}" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 16"/>` : ''
              }</g>`,
          )
          .join('')

        const rain =
          farm.weather.rain48h >= 10
            ? `<g class="rain" pointer-events="none"><rect x="-1200" y="-200" width="3600" height="920" fill="#0b2e1b" opacity=".18"/>${RAIN.map(
                ([x, y, o]) => `<line x1="${x}" y1="${y}" x2="${x - 8}" y2="${y + 26}" stroke="#8cc0e3" stroke-width="2" stroke-linecap="round" opacity="${o}"/>`,
              ).join('')}</g>`
            : ''

        return `
          <svg id="farm-svg" viewBox="${W ? '0 0 1200 520' : '150 24 900 560'}" preserveAspectRatio="xMidYMid meet" class="block size-full" role="group" aria-label="${T_.mapTitle}">
            <defs>
              <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity=".09"/></pattern>
              <pattern id="rows" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><path d="M0 7H14" stroke="#0b2e1b" stroke-width="1.6" opacity=".16"/></pattern>
              <pattern id="trees" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="5.5" fill="#0b2e1b" opacity=".22"/><circle cx="23" cy="23" r="5.5" fill="#0b2e1b" opacity=".22"/></pattern>
              <pattern id="beds" width="22" height="18" patternUnits="userSpaceOnUse"><rect y="2" width="22" height="8" rx="4" fill="#0b2e1b" opacity=".16"/></pattern>
              <pattern id="drySparse" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.7" fill="#5b4527" opacity=".45"/></pattern>
              <pattern id="dryDense" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.6" fill="#5b4527" opacity=".55"/><circle cx="8" cy="8" r="1.2" fill="#5b4527" opacity=".4"/></pattern>
              <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="12" fill="#fff" opacity=".3"/></pattern>
              <pattern id="sheen" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><rect width="46" height="46" fill="#2e86c1" opacity=".42"/><path d="M4 12h20M26 32h14" stroke="#dcecf7" stroke-width="2.5" stroke-linecap="round" opacity=".75"/></pattern>
              <linearGradient id="gloss" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>

      // Signs grow when the plan is drawn small so their text stays at 12px or more (on wide maps, the 15px action text sets the scale).
      function measureSigns() {
        const svg = $('#farm-svg')
        if (!svg) return
        const r = svg.getBoundingClientRect()
        const [vw, vh] = wide() ? [1200, 520] : [900, 560]
        const s = Math.min(r.width / vw, r.height / vh)
        if (!s) return
        const k = Math.min(wide() ? 1.45 : 2.1, Math.max(1, 12 / ((wide() ? 15 : 17) * s)))
        if (Math.abs(k - S.signK) > 0.02) {
          S.signK = k
          $('#farm').innerHTML = farmSvg()
        }
      }

      /* ================================================================
       * Dashboard section

        $('#dashboard').innerHTML = `
          <div class="flex flex-wrap items-end justify-between gap-6" data-reveal>

          ${selectBox('crop', T_.cropLabel, S.crop, CROP_IDS.map((c) => ({ value: c, label: T_.crops[c] })), 'sprout')}`
      }

      function renderLiveNote() {
        const T_ = t()
        const box = $('#live-note')
        if (S.source !== 'live') return (box.innerHTML = '')
        if (S.live.status === 'loading' && !S.live.data)
          return (box.innerHTML = `<p class="inline-flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-semibold text-moss-800 shadow-card">${icon('refresh-cw', 'size-4 animate-spin')}${T_.liveLoading}</p>`)
        if (S.live.status === 'error' || S.live.status === 'cached')
          return (box.innerHTML = `<p class="inline-flex flex-wrap items-center gap-2 rounded-full bg-sun-100 px-4 py-2 text-sm font-semibold text-sun-700">${
            S.live.status === 'error' ? T_.liveError : T_.liveCached(new Date(S.live.data.fetchedAt).toLocaleString(T_.locale))
          }<button type="button" data-action="retry" class="font-bold underline underline-offset-2">${T_.retry}</button></p>`)
        box.innerHTML = ''
      }

      const LEGEND = {
        moisture: [['#7ccf45'], ['#bfd154', 1], ['#dccb8c', 2]],
        ndvi: [['#3fae4a'], ['#9fd55a'], ['#dccb8c']],

      function renderMapCard() {
        const T_ = t()
        const { farm } = D
        const last = farm.days.length - 1
        const labels = S.layer === 'moisture' ? T_.legendMoisture(farm.need) : S.layer === 'ndvi' ? T_.legendNdvi : T_.droughtLevels

            : `<span class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-full bg-sun-100 px-3 py-1.5 text-[13px] font-bold text-sun-700 shadow-card">${icon('flask-conical', 'size-3.5')}<span class="sm:hidden">${T_.demoPillShort}</span><span class="max-sm:hidden">${T_.demoPill}</span></span>`
        $('#map-card').innerHTML = `
          <div class="overflow-hidden rounded-[28px] border bg-moss-900 shadow-card transition-shadow duration-300 hover:shadow-lift ${

          }">
            <div class="relative flex flex-col-reverse xl:block">

                <div class="flex shrink-0 flex-wrap gap-1.5">${pillData}${

            }
          </div>
          <p class="sr-only" aria-live="polite">${T_.plot} ${S.selected}: ${farm.plots.find((p) => p.id === S.selected).moisture}%</p>`
        requestAnimationFrame(measureSigns)
        runFlow()
      }

      // The water line starts empty and runs from the gate once per watering; later re-renders show it full.
      function runFlow() {
        if (!S.flowing) return (S.flowShown = null)
        if (S.flowShown === S.flowing) return
        const id = S.flowing
        requestAnimationFrame(() =>
          requestAnimationFrame(() => {
            document.querySelectorAll(`[data-flow="${id}"],[data-wet="${id}"]`).forEach((el) => (el.dataset.on = 'true'))
            S.flowShown = id
          }),
        )
      }

      function readingCard(inner, whatIf) {
        return `<div class="relative rounded-3xl border border-line bg-white p-5 shadow-card transition-all duration-300 hover:-translate-y-1 hover:shadow-lift">${
          whatIf ? `<div class="mb-2.5">${whatIfTag()}</div>` : ''
        }${inner}</div>`
      }

      function renderReadings() {
        const T_ = t()
        const { farm } = D
        const crop = T_.crops[farm.crop]
        const mSt = moistureStatus(farm.avg.moisture, farm.need)
        const nSt = ndviStatus(farm.avg.ndvi)
        const max = farm.unit === 'sat' ? 100 : 60
        const needPct = (farm.need / max) * 100
        const weak = farm.plots.reduce((a, b) => (b.ndvi < a.ndvi ? b : a))
        const dTone = farm.level >= 3 ? 'bad' : farm.level >= 1 ? 'warn' : 'good'
        const moisture = readingCard(
          `<h3 class="flex items-center gap-2 text-[15px] font-bold">${icon('droplets', 'size-5 text-water-500')}${term('moisture', T_.moistureName)}</h3>

          </div>
          <div class="relative mt-5 h-2.5 rounded-full bg-moss-100"><div class="h-full rounded-full bg-water-500 transition-[width] duration-700" style="width:${Math.min(100, (farm.avg.moisture / max) * 100)}%"></div><div class="absolute -top-1.5 h-5.5 w-0.5 rounded bg-moss-950" style="left:${needPct}%"></div></div>
          <p class="mt-2 text-sm leading-relaxed text-muted">${T_.moistureDesc(crop, farm.need, farm.unit === 'sat')}</p>`,
          farm.whatIf,

        const ndvi = readingCard(
          `<h3 class="flex items-center gap-2 text-[15px] font-bold">${icon('leaf', 'size-5 text-moss-700')}<span>${T_.ndviName} (${term('ndvi', 'NDVI')})</span></h3>
          <div class="mt-3 flex flex-wrap items-end justify-between gap-2">
            <p class="tabular text-5xl font-extrabold leading-none tracking-tight">${fmt(farm.avg.ndvi, S.lang)}${

            }</p>
            ${badge(nSt.tone, T_.status[nSt.key])}
          </div>
          <div class="relative mt-5"><div class="h-2.5 rounded-full" style="background:linear-gradient(90deg,#b59a74,#d3c887 25%,#a9c94f 50%,#4c9a2e 75%,#0f3d24)"></div><div class="absolute -top-1.5 size-5.5 -translate-x-1/2 rounded-full border-[3px] border-white bg-moss-950 shadow-card transition-[left] duration-700" style="left:${farm.avg.ndvi * 100}%"></div></div>
          <p class="mt-2 text-sm leading-relaxed text-muted">${T_.ndviDesc(weak.ndvi < farm.avg.ndvi - 0.05 ? weak.id : null, farm.avg.ndvi >= 0.6)}</p>`,
          false,
        )
        const drought = readingCard(
          `<h3 class="flex items-center gap-2 text-[15px] font-bold">${icon('sun', 'size-5 text-sun-400')}${term('drought', T_.droughtName)}</h3>

            (c, i) =>

          </button>`
        $('#readings').innerHTML = moisture + ndvi + drought + cta
      }

      /* ================================================================
       * Advice panel
       * ================================================================ */
      const REASON_ICON = { drop: 'droplets', sun: 'sun', leaf: 'leaf', clock: 'calendar-clock', cloud: 'cloud-rain' }

      function timeline(plan) {
        const T_ = t()
        const from = 5 * 60
        const to = 23 * 60
        const pct = (m) => ((m - from) / (to - from)) * 100
        const bands = [
          [5, 7, '#fdf1d3'],
          [7, 11, '#eef4ef', T_.phases.day],
          [11, 15, '#f6ddd2', T_.phases.hot, true],
          [15, 17, '#eef4ef'],
          [17, 19, '#dcecf7'],
          [19, 23, '#dfe5ee', T_.phases.night],
        ]
        const s = plan.start
        const e = plan.start + plan.minutes
        return `
          <div class="relative h-7"><span class="tabular absolute bottom-1 -translate-x-1/2 whitespace-nowrap rounded-full bg-moss-900 px-2.5 py-0.5 text-xs font-bold text-white" style="left:${(pct(s) + pct(e)) / 2}%">${T_.phases.dusk} · ${plan.minutes}′</span></div>
          <div class="relative h-14 overflow-hidden rounded-2xl border border-line">
            ${bands
              .map(
                ([a, b, bg, label, hatch]) =>
                  `<div class="absolute inset-y-0" style="left:${pct(a * 60)}%;width:${pct(b * 60) - pct(a * 60)}%;background:${bg};${
                    hatch ? 'background-image:repeating-linear-gradient(135deg,#c4481f22 0 6px,transparent 6px 12px)' : ''
                  }">${label ? `<span class="absolute left-1.5 top-1.5 hidden whitespace-nowrap text-xs font-semibold text-muted sm:block">${label}</span>` : ''}</div>`,
              )
              .join('')}
            <div class="absolute inset-y-1.5 rounded-lg bg-moss-900" style="left:${pct(s)}%;width:${pct(e) - pct(s)}%"></div>
          </div>
          <div class="tabular relative mt-1.5 h-5 text-xs font-medium text-muted">${[6, 9, 12, 15, 18, 21]
            .map((h) => `<span class="absolute -translate-x-1/2" style="left:${pct(h * 60)}%">${h}:00</span>`)
            .join('')}</div>
          <p class="tabular mt-1 text-sm font-bold text-moss-800">${hhmm(s)} – ${hhmm(e)} · ${plan.minutes} ${T_.minutes}</p>`
      }

      function renderAdvice() {
        const box = $('#advice')
        if (!S.showAdvice) return (box.innerHTML = '')
        const T_ = t()
        const { plan, text } = D
        const meth = methodInfo(plan.method, S.lang)
        const today = todayIso()
        const scheduled = S.log.some((e) => e.date === today && e.plot === plan.plot.id && e.status === 'planned')
        const head = plan.type === 'fine' ? 'bg-moss-800' : 'bg-moss-950'

                  <h2 id="advice-title" class="max-w-3xl text-2xl font-extrabold leading-snug tracking-tight sm:text-3xl">${text.headline}</h2>
                </div>
                <div class="flex shrink-0 items-center gap-1">

                  <button type="button" data-action="close-advice" aria-label="${T_.close}" class="rounded-full p-2 text-white transition-colors hover:bg-white/10">${icon('x', 'size-5')}</button>
                </div>
              </div>
              <p class="mt-4 max-w-[70ch] text-base leading-relaxed text-white">${text.summary}</p>
            </div>
            <div class="grid gap-10 px-6 py-7 sm:px-8 ${plan.type === 'water' ? 'lg:grid-cols-[1.1fr_1fr]' : ''}">
              <div>
                <h3 class="text-lg font-extrabold">${T_.why}</h3>
                <ul class="mt-3 space-y-3">${text.reasons
                  .map(
                    (r) =>
                      `<li class="flex gap-3 leading-relaxed"><span class="mt-0.5 grid size-8 shrink-0 place-items-center rounded-full bg-lime-100 text-moss-800">${icon(REASON_ICON[r.icon], 'size-4')}</span><span>${r.text} ${

                  .join('')}</ul>
                <h3 class="mt-8 text-lg font-extrabold">${T_.steps}</h3>
                <ol class="mt-3 space-y-2.5">${text.steps
                  .map(
                    (s, i) =>
                      `<li class="flex gap-3 leading-relaxed"><span class="tabular grid size-7 shrink-0 place-items-center rounded-full bg-moss-900 text-sm font-bold text-lime-400">${i + 1}</span><span class="pt-0.5">${s}</span></li>`,

      /* ================================================================
       * Weather section (dark)
       * ================================================================ */
      /* The week just measured and the week ahead on one clean chart.
         Soil moisture bars (lime = below what the crop needs), the need line, forecast rain bars,
         weather icons and highs on top, dates and NDVI values in their own rows underneath.
         Nothing is drawn on top of anything else. */
      function weekChart() {
        const T_ = t()
        const { farm } = D
        const forecast = D.realToday.forecast
        const W = wide()
        const Wd = W ? 1040 : 340
        const fs = W ? 14 : 13
        const pad = { l: W ? 52 : 40, r: W ? 16 : 8, t: W ? 80 : 66, b: W ? 70 : 64 }
        const ih = W ? 220 : 190
        const H = pad.t + ih + pad.b
        const past = farm.days.length
        const future = forecast?.length ?? 0
        const n = past + future
        const iw = Wd - pad.l - pad.r
        const slot = iw / n
        const bw = slot * (W ? 0.56 : 0.62)
        const cx = (i) => pad.l + slot * (i + 0.5)
        const max = farm.unit === 'sat' ? 100 : 60
        const ticks = farm.unit === 'sat' ? [0, 50, 100] : [0, 20, 40, 60]
        const ym = (v) => pad.t + ih - (Math.min(v, max) / max) * ih
        // Rain bars scale to the wettest day and stop 26 units below the top, so their labels stay inside the chart.
        const rainMax = Math.max(20, ...(forecast || []).map((d) => d.rain))
        const yr = (mm) => pad.t + ih - (Math.min(mm, rainMax) / rainMax) * (ih - 26)
        const { moisture, ndvi } = farm.history
        const divider = pad.l + slot * past
        const every = W ? 1 : 2
        const yDate = pad.t + ih + 26
        const yNdvi = pad.t + ih + 54
        const glyph = (d) => (d.rain >= 10 ? 'cloud-rain' : d.rain >= 1 ? 'cloud-drizzle' : d.prob >= 40 ? 'cloud' : 'sun')
        const g = W ? 24 : 18
        const svgIcon = (name, x, y, color) => (ICONS[name] || '').replace('<svg ', `<svg x="${x}" y="${y}" width="${g}" height="${g}" color="${color}" `)
        const dayText = (iso, i) => {
          if (i === past - 1 && D.eff !== 'live') return W ? T_.today : new Date(`${iso}T00:00:00`).getDate()
          return W ? shortDate(iso) : new Date(`${iso}T00:00:00`).getDate()
        }
        return `
          <svg viewBox="0 0 ${Wd} ${H}" class="w-full" role="img" aria-label="${L[S.lang].wxTitle}">
            <!-- day being viewed (time-lapse), and the forecast side on a faint water wash -->
            <rect x="${cx(farm.dayIndex) - slot / 2}" y="${pad.t - 6}" width="${slot}" height="${ih + 44}" rx="10" fill="#ffffff" opacity=".07"/>
            ${future ? `<rect x="${divider}" y="${pad.t - 6}" width="${slot * future}" height="${ih + 6}" rx="10" fill="#2e86c1" opacity=".12"/>` : ''}

            <!-- section labels -->
            <text x="${pad.l}" y="18" font-size="${fs}" font-weight="800" fill="#cff08a">${T_.measured}</text>
            ${future ? `<text x="${divider + 10}" y="18" font-size="${fs}" font-weight="800" fill="#8cc0e3">${T_.forecastTitle}</text>` : ''}

            <!-- moisture axis -->
            ${ticks
              .map(
                (v) =>
                  `<line x1="${pad.l}" x2="${divider}" y1="${ym(v)}" y2="${ym(v)}" stroke="#ffffff" opacity=".1"/><text x="${pad.l - 8}" y="${ym(v) + 5}" font-size="${fs}" fill="#ffffffb3" text-anchor="end" class="tabular">${v}%</text>`,
              )
              .join('')}

            <!-- measured week: moisture bars -->
            ${moisture
              .map((v, i) => {
                const low = v < farm.need
                return `<rect x="${cx(i) - bw / 2}" y="${ym(v)}" width="${bw}" height="${ym(0) - ym(v)}" rx="7" fill="${low ? '#b8e55a' : '#5fae52'}"/>${
                  W ? `<text x="${cx(i)}" y="${ym(0) - 12}" font-size="${fs}" font-weight="800" fill="#0b2e1b" text-anchor="middle" class="tabular">${v}</text>` : ''
                }`
              })
              .join('')}
            <line x1="${pad.l}" x2="${divider}" y1="${ym(farm.need)}" y2="${ym(farm.need)}" stroke="#fdf1d3" stroke-width="2.5" stroke-dasharray="7 6"/>

            <!-- today divider -->
            ${future ? `<line x1="${divider}" x2="${divider}" y1="${pad.t - 6}" y2="${pad.t + ih}" stroke="#ffffff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="4 5"/>` : ''}

            <!-- forecast week: icon and high on top, rain bars below -->
            ${!W && future ? `<text x="${divider - 6}" y="${58}" font-size="${fs}" font-weight="700" fill="#ffffffb3" text-anchor="end">°C</text>` : ''}
            ${(forecast || [])
              .map((d, k) => {
                const i = past + k
                return `${svgIcon(glyph(d), cx(i) - g / 2, W ? 26 : 24, d.rain >= 1 ? '#8cc0e3' : d.prob >= 40 ? '#ffffffb3' : '#f2b134')}
                  <text x="${cx(i)}" y="${W ? 68 : 58}" font-size="${fs}" font-weight="800" fill="#ffffff" text-anchor="middle" class="tabular">${W ? `${d.tMax}°` : d.tMax}</text>
                  ${
                    d.rain > 0
                      ? `<rect x="${cx(i) - bw / 2}" y="${yr(d.rain)}" width="${bw}" height="${yr(0) - yr(d.rain)}" rx="7" fill="#8cc0e3"/><text x="${cx(i)}" y="${yr(d.rain) - 8}" font-size="${fs}" font-weight="800" fill="#dcecf7" text-anchor="middle" class="tabular">${d.rain}</text>`
                      : ''
                  }`
              })
              .join('')}
            <line x1="${pad.l}" x2="${Wd - pad.r}" y1="${ym(0)}" y2="${ym(0)}" stroke="#ffffff" opacity=".3"/>

            <!-- rows under the chart: dates, then NDVI for the measured days -->
            ${farm.days
              .map((iso, i) =>
                i % every === (past - 1) % every
                  ? `<text x="${cx(i)}" y="${yDate}" font-size="${fs}" font-weight="${i === farm.dayIndex ? 800 : 500}" fill="${i === farm.dayIndex ? '#ffffff' : '#ffffffb3'}" text-anchor="middle" class="tabular">${dayText(iso, i)}</text>`
                  : '',
              )
              .join('')}
            ${(forecast || [])
              .map((d, k) =>
                k % every === 0
                  ? `<text x="${cx(past + k)}" y="${yDate}" font-size="${fs}" font-weight="500" fill="#ffffffb3" text-anchor="middle" class="tabular">${W ? shortDate(d.date) : new Date(`${d.date}T00:00:00`).getDate()}</text>`
                  : '',
              )
              .join('')}
            <text x="${pad.l - 8}" y="${yNdvi}" font-size="${fs - 1}" font-weight="800" fill="#cff08a" text-anchor="end">NDVI</text>
            ${ndvi
              .map((v, i) =>
                i % every === (past - 1) % every
                  ? `<text x="${cx(i)}" y="${yNdvi}" font-size="${fs - 1}" font-weight="700" fill="#cff08a" text-anchor="middle" class="tabular">${fmt(v, S.lang)}</text>`
                  : '',
              )
              .join('')}
          </svg>`
      }

                    ['leaf', 'MODIS', 'NDVI', D.eff === 'live' && !farm.ndviSimulated ? T_.srcNdviLive(shortDate(farm.ndviDate)) : T_.srcNdviDemo],
                    ['cloud-rain', T_.forecastTitle, T_.whatWeather, T_.srcWeather(D.eff === 'live')],

              <article id="whatif" class="group overflow-hidden rounded-[28px] bg-moss-900 transition-all duration-300 hover:-translate-y-1 ${farm.whatIf ? 'outline-2 outline-dashed outline-sun-400' : ''}" data-reveal style="transition-delay:200ms"></article>

      function renderWhatIf() {

          rain48h: D.realToday.weather.rain48h,
          tMax: D.realToday.weather.tMax,
        }
        const s = S.scenario ?? base

        const slider = (key, label, value, min, max, unit) => `
          <div>
            <div class="flex items-baseline justify-between gap-3"><label for="sim-${key}" class="text-sm font-semibold text-white/85">${label}</label><output id="out-${key}" class="tabular text-base font-extrabold text-lime-300">${value} <span class="text-sm font-bold text-white/60">${unit}</span></output></div>
            <input id="sim-${key}" data-sim="${key}" data-unit="${unit}" type="range" min="${min}" max="${max}" value="${value}" class="range mt-1 w-full" style="--fill:${((value - min) / (max - min)) * 100}%;--track-off:rgb(255 255 255 / .15)" />
          </div>`

                )

              ${S.scenario ? `<button type="button" data-action="clear-sim" class="rounded-full px-3 py-1.5 text-sm font-bold text-white/80 underline underline-offset-2 hover:text-white">${T_.simClear}</button>` : ''}

              ${slider('moisture', T_.simMoisture, s.moisture, mRange[0], mRange[1], '%')}
              ${slider('dryDays', T_.simDry, s.dryDays, 0, 20, T_.days)}
              ${slider('rain48h', T_.simRain, s.rain48h, 0, 40, 'mm')}
              ${slider('tMax', T_.simTemp, s.tMax, 26, 40, '°C')}
            </div>
            <div id="whatif-result" class="mt-5"></div>

              <h3 class="text-xl font-extrabold">${T_.logTitle}</h3>
