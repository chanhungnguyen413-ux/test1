      function renderAssistant(root) {
        const T_ = t()
        const msgs = S.chat
          .map((m) =>
            m.role === 'user'
              ? `<p class="ml-auto w-fit max-w-[85%] rounded-3xl rounded-br-lg bg-moss-900 px-4 py-2.5 text-[15px] leading-relaxed text-white">${esc(m.text)}</p>`
              : `<div class="max-w-[92%] rounded-3xl rounded-bl-lg border border-line bg-white px-4 py-3 shadow-card"><p class="whitespace-pre-wrap text-[15px] leading-relaxed">${m.text ? esc(m.text).replace(/\*\*(.+?)\*\*/g, '<strong class="font-extrabold">$1</strong>').replace(/^\s*[*-] /gm, '• ') : `<span class="text-muted">${T_.answering}</span>`}${
                  m.pending && m.text ? '<span class="ml-0.5 inline-block h-4 w-1.5 animate-pulse rounded-sm bg-lime-500 align-middle"></span>' : ''
                }</p>${!m.pending ? `<p class="mt-2 flex items-center gap-1 text-xs font-bold text-muted">${icon('sparkles', 'size-3.5')}${m.source === 'ai' ? T_.aiAnswer : T_.sampleAnswer}</p>` : ''}</div>`,
          )
          .join('')
        const existing = $('#chat-list')
        if (existing) {
          existing.innerHTML = msgs || suggestions()
          existing.scrollTop = existing.scrollHeight
          $('#chat-send').disabled = S.busy
          return
        }
        root.innerHTML = `
          <div class="scrim-in fixed inset-0 z-50 flex justify-end bg-moss-950/40" data-scrim>
            <aside role="dialog" aria-modal="true" aria-labelledby="assistant-title" class="drawer-in flex h-dvh w-full flex-col bg-ground shadow-lift sm:w-[440px] sm:rounded-l-[32px]">
              <header class="flex items-center justify-between gap-3 px-6 py-5">
                <h2 id="assistant-title" class="flex items-center gap-3 text-lg font-extrabold"><span class="grid size-10 place-items-center rounded-full bg-lime-400 text-moss-950">${icon('bot', 'size-5')}</span>${T_.assistantTitle}</h2>
                <button type="button" data-action="close-dialog" aria-label="${T_.close}" class="rounded-full p-2 text-muted hover:bg-white hover:text-ink">${icon('x', 'size-5')}</button>
              </header>
              <div id="chat-list" class="flex-1 space-y-3 overflow-y-auto px-6 pb-4" aria-live="polite">${msgs || suggestions()}</div>
              <form id="chat-form" class="flex items-end gap-2 border-t border-line bg-white px-4 py-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]">
                <label for="chat-input" class="sr-only">${T_.placeholder}</label>
                <textarea id="chat-input" rows="1" maxlength="600" placeholder="${T_.placeholder}" class="max-h-32 min-h-12 flex-1 resize-none rounded-3xl border border-line bg-ground px-4 py-3 text-[15px] outline-none placeholder:text-muted focus:border-moss-700"></textarea>
                <button id="chat-send" type="submit" aria-label="${T_.send}" class="grid size-12 shrink-0 place-items-center rounded-full bg-lime-400 text-moss-950 transition-colors hover:bg-lime-300 disabled:bg-line">${icon('send-horizontal', 'size-5')}</button>
              </form>
            </aside>
          </div>`
        $('#chat-input').focus()
      }
      const suggestions = () => {
        const T_ = t()
        return `<p class="leading-relaxed text-muted">${T_.assistantIntro}</p><div class="mt-4 flex flex-col items-start gap-2">${T_.suggestions
          .map((s) => `<button type="button" data-action="ask" data-value="${esc(s)}" class="rounded-full border border-line bg-white px-4 py-2 text-left text-sm font-bold text-moss-900 transition-colors hover:border-moss-700">${esc(s)}</button>`)
          .join('')}</div>`
      }

      async function ask(q) {
        q = q.trim()
        if (!q || S.busy) return
        S.busy = true
        const history = [...S.chat, { role: 'user', text: q }]
        S.chat = [...history, { role: 'model', text: '', source: 'ai', pending: true }]
        renderOverlay()
        const last = () => S.chat[S.chat.length - 1]
        let answer = null
        if (served) {
          try {
            const res = await fetch('/api/assistant', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                lang: S.lang,
                context: assistantContext({ farm: D.nowFarm, plans: D.plans, source: D.eff, provinceName: PROVINCES.find((p) => p.id === S.provinceId).name }),
                messages: history.slice(-10).map((m) => ({ role: m.role, text: m.text })),
              }),
            })
            if (res.ok && res.body) {
              const reader = res.body.getReader()
              const dec = new TextDecoder()
              let text = ''
              for (;;) {
                const { done, value } = await reader.read()
                if (done) break
                text += dec.decode(value, { stream: true })
                last().text = text
                renderOverlay()
              }
              answer = text.trim() || null
            }
          } catch {
            answer = null
          }
        }
        Object.assign(last(), answer ? { text: answer, pending: false } : { text: fallbackAnswer(q, { farm: D.nowFarm, plans: D.plans, selectedText: D.text }, S.lang), source: 'sample', pending: false })
        S.busy = false
        renderOverlay()
      }

      /* ================================================================
       * Render orchestration
       * ================================================================ */
      function renderAll() {
        D = derive()
        document.documentElement.lang = S.lang
        renderNav()
        renderHero()
        renderHeroChip()
        renderStats()
        renderMission()
        renderDashboard()
        renderSolutions()
        renderWeather()
        renderWater()
        renderStories()
        renderCta()
        renderFooter()
        renderFloating()
        renderOverlay()
        closeTerm()
        wireMotion()
      }

      // Updates what depends on farm numbers, leaving the sliders being dragged untouched.
      function renderLive({ sliders = false } = {}) {
        D = derive()
        renderHeroChip()
        renderLiveNote()
        renderMapCard()
        renderReadings()
        renderAdvice()
        $('#week-chart').innerHTML = weekChart()
        const wi = $('#whatif')
        wi.classList.toggle('outline-2', D.farm.whatIf)
        wi.classList.toggle('outline-dashed', D.farm.whatIf)
        wi.classList.toggle('outline-sun-400', D.farm.whatIf)
        if (sliders) renderWhatIf()
        else renderWhatIfResult()
        renderWater()
        renderFloating()
        revealNow('#water [data-reveal]')
      }
      const revealNow = (sel) => document.querySelectorAll(sel).forEach((el) => el.classList.add('is-in'))

      /* ================================================================
       * Actions
       * ================================================================ */
      let playTimer = null
      let flowTimer = null
      const persist = () => {
        store.set('naf-lang', S.lang)
        store.set('naf-source', S.source)
        store.set('naf-province', S.provinceId)
        store.set('naf-crop', S.crop)
        store.set('naf-log', S.log)
      }

      function resetView() {
        S.scenario = null
        S.preset = null
        S.day = null
        stopPlay()
      }
      function stopPlay() {
        S.playing = false
        clearInterval(playTimer)
      }

      function openAdvice(plotId = S.selected) {
        clearTimeout(flowTimer)
        stopPlay()
        S.day = null
        S.selected = plotId
        D = derive()
        const p = D.byId[plotId]
        S.showAdvice = false
        S.flowing = p.type === 'water' ? plotId : null
        renderLive()
        document.getElementById('dashboard').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
        flowTimer = setTimeout(
          () => {
            S.showAdvice = true
            renderAdvice()
            renderReadings()
            const panel = $('#advice-panel')
            panel?.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
            panel?.focus({ preventScroll: true })
          },
          reduced() || p.type !== 'water' ? 60 : 900,
        )
      }

      async function loadLive() {
        const province = PROVINCES.find((p) => p.id === S.provinceId)
        const cached = readCachedLive(province.id)
        S.live = { status: 'loading', data: cached }
        renderLive({ sliders: true })
        try {
          S.live = { status: 'ok', data: await fetchLive(province) }
        } catch {
          S.live = { status: cached ? 'cached' : 'error', data: cached }
        }
        resetView()
        renderAll()
      }

      function solution(key) {
        const go = (id) => document.getElementById(id).scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' })
        if (key === 'plot') go('dashboard')
        if (key === 'whatif') go('whatif')
        if (key === 'water') go('water')
        if (key === 'share') ((S.dialog = 'share'), renderOverlay())
        if (key === 'assistant') ((S.dialog = 'assistant'), renderOverlay())
        if (key === 'replay') {
          go('dashboard')
          setTimeout(togglePlay, reduced() ? 0 : 700)
        }
      }

      function togglePlay() {
        if (S.playing) {
          stopPlay()
          return renderMapCard()
        }
        S.scenario = null
        S.preset = null
        S.showAdvice = false
        S.flowing = null
        S.day = 0
        S.playing = true
        renderLive({ sliders: true })
        playTimer = setInterval(() => {
          const last = D.farm.days.length - 1
          const next = (S.day ?? -1) + 1
          if (next >= last) {
            S.day = null
            stopPlay()
          } else S.day = next
          renderLive()
        }, 750)
      }

      document.addEventListener('click', (e) => {
        const termBtn = e.target.closest('[data-term]')
        if (termBtn) {
          e.preventDefault()
          return openTerm(termBtn)
        }
        if (openTermEl && !e.target.closest('#term-pop')) closeTerm()
        if (e.target.matches('[data-scrim]')) {
          S.dialog = null
          return renderOverlay()
        }
        const plot = e.target.closest('[data-plot]')
        if (plot) return selectPlot(plot.dataset.plot)
        const a = e.target.closest('[data-action]')
        if (!a) return
        const v = a.dataset.value
        switch (a.dataset.action) {
          case 'lang':
            S.lang = v
            persist()
            return renderAll()
          case 'source':
            S.source = v
            persist()
            resetView()
            if (v === 'live') return loadLive()
            return renderAll()
          case 'layer':
            S.layer = v
            return renderMapCard()
          case 'goto':
            return document.getElementById(v).scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth' })
          case 'open-advice':
            return openAdvice(v || S.selected)
          case 'close-advice':
            S.showAdvice = false
            S.flowing = null
            return renderLive()
          case 'schedule':
            S.log = [...S.log, { id: `u${Date.now()}`, date: todayIso(), plot: D.plan.plot.id, minutes: D.plan.minutes, m3: D.plan.m3, flood: D.plan.flood, status: 'planned' }]
            persist()
            return renderLive()
          case 'unschedule':
            S.log = S.log.filter((x) => !(x.date === todayIso() && x.plot === D.plan.plot.id && x.status === 'planned'))
            persist()
            return renderLive()
          case 'done':
            S.log = S.log.map((x) => (x.id === v ? { ...x, status: 'done' } : x))
            persist()
            return renderLive()
          case 'play':
            return togglePlay()
          case 'today':
            stopPlay()
            S.day = null
            return renderLive()
          case 'preset': {
            const base = { moisture: D.realToday.avg.moisture, dryDays: D.realToday.weather.dryDays, rain48h: D.realToday.weather.rain48h, tMax: D.realToday.weather.tMax }
            stopPlay()
            S.day = null
            S.scenario = presetValues(base, D.farm.need)[v]
            S.preset = v
            return renderLive({ sliders: true })
          }
          case 'clear-sim':
            S.scenario = null
            S.preset = null
            return renderLive({ sliders: true })
          case 'carousel': {
            const c = $('#carousel')
            return c.scrollBy({ left: Number(v) * (c.firstElementChild.offsetWidth + 20), behavior: reduced() ? 'auto' : 'smooth' })
          }
          case 'solution':
            return solution(v)
          case 'share':
            S.dialog = 'share'
            return renderOverlay()
          case 'assistant':
            S.dialog = 'assistant'
            return renderOverlay()
          case 'close-dialog':
            S.dialog = null
            return renderOverlay()
          case 'close-term':
            return closeTerm()
          case 'print':
            return window.print()
          case 'copy':
            return navigator.clipboard?.writeText(shareText()).then(() => {
              const l_ = $('#copy-label')
              if (l_) l_.textContent = t().copied
            })
          case 'native-share':
            return navigator.share({ title: 'NASA Adapting Farms', text: shareText() }).catch(() => {})
          case 'ask':
            return ask(v)
          case 'retry':
            return loadLive()
        }
      })

      function selectPlot(id) {
        S.selected = id
        if (S.showAdvice) {
          D = derive()
          S.flowing = D.byId[id].type === 'water' ? id : null
        }
        renderLive()
      }

      document.addEventListener('keydown', (e) => {
        const plot = e.target.closest?.('[data-plot]')
        if (plot && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault()
          return selectPlot(plot.dataset.plot)
        }
        if (e.key !== 'Escape') return
        if (openTermEl) return closeTerm()
        if (S.dialog) {
          S.dialog = null
          return renderOverlay()
        }
        if (S.showAdvice) {
          S.showAdvice = false
          S.flowing = null
          renderLive()
        }
      })

      document.addEventListener('change', (e) => {
        const sel = e.target.closest('[data-select]')
        if (!sel) return
        if (sel.dataset.select === 'crop') {
          S.crop = sel.value
          persist()
          resetView()
          return renderAll()
        }
        if (sel.dataset.select === 'province') {
          S.provinceId = sel.value
          persist()
          return loadLive()
        }
      })

      document.addEventListener('input', (e) => {
        if (e.target.id === 'day-slider') {
          const last = D.farm.days.length - 1
          const v = Number(e.target.value)
          stopPlay()
          S.scenario = null
          S.preset = null
          S.day = v === last ? null : v
          return renderLive({ sliders: true })
        }
        const key = e.target.dataset?.sim
        if (!key) return
        const base = { moisture: D.realToday.avg.moisture, dryDays: D.realToday.weather.dryDays, rain48h: D.realToday.weather.rain48h, tMax: D.realToday.weather.tMax }
        const value = Number(e.target.value)
        stopPlay()
        S.day = null
        S.scenario = { ...(S.scenario ?? base), [key]: value }
        if (S.preset) {
          S.preset = null
          document.querySelectorAll('[data-action="preset"]').forEach((b) => b.setAttribute('aria-pressed', 'false'))
        }
        const min = Number(e.target.min)
        const max = Number(e.target.max)
        e.target.style.setProperty('--fill', `${((value - min) / (max - min)) * 100}%`)
        $(`#out-${key}`).innerHTML = `${value} <span class="text-sm font-bold text-white/60">${e.target.dataset.unit}</span>`
        renderLive()
      })

      document.addEventListener('submit', (e) => {
        if (e.target.id !== 'chat-form') return
        e.preventDefault()
        const input = $('#chat-input')
        const q = input.value
        input.value = ''
        ask(q)
      })
      document.addEventListener('keydown', (e) => {
        if (e.target.id === 'chat-input' && e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault()
          $('#chat-form').requestSubmit()
        }
      })

      /* ================================================================
       * Motion: reveal on scroll, count-ups, the statement, the nav
       * ================================================================ */
      const io = new IntersectionObserver(
        (entries) => {
          for (const en of entries) {
            if (!en.isIntersecting) continue
            en.target.classList.add('is-in')
            en.target.querySelectorAll('[data-count]').forEach(countUp)
            io.unobserve(en.target)
          }
        },
        { threshold: 0.12, rootMargin: '0px 0px -40px 0px' },
      )
      function wireMotion() {
        document.querySelectorAll('[data-reveal]:not(.is-in)').forEach((el) => {
          if (reduced()) {
            el.classList.add('is-in')
            el.querySelectorAll('[data-count]').forEach(countUp)
          } else io.observe(el)
        })
        onScroll()
      }
      function countUp(el) {
        if (el.dataset.done) return
        el.dataset.done = '1'
        const target = Number(el.dataset.count)
        if (reduced()) return (el.textContent = target)
        const t0 = performance.now()
        const step = (now) => {
          const k = Math.min(1, (now - t0) / 1400)
          el.textContent = Math.round(target * (1 - Math.pow(1 - k, 4)))
          if (k < 1) requestAnimationFrame(step)
        }
        requestAnimationFrame(step)
      }
      let ticking = false
      function onScroll() {
        if (ticking) return
        ticking = true
        requestAnimationFrame(() => {
          ticking = false
          $('#nav').dataset.solid = String(scrollY > 40)
          const p = $('[data-mission]')
          if (!p) return
          const words = p.querySelectorAll('.word')
          if (reduced()) return words.forEach((w) => w.classList.add('lit'))
          const r = p.getBoundingClientRect()
          const progress = Math.min(1, Math.max(0, (innerHeight * 0.85 - r.top) / (r.height + innerHeight * 0.35)))
          const lit = Math.round(progress * words.length)
          words.forEach((w, i) => w.classList.toggle('lit', i < lit))
        })
      }
      addEventListener('scroll', onScroll, { passive: true })
      let resizeTimer
      addEventListener('resize', () => {
        clearTimeout(resizeTimer)
        resizeTimer = setTimeout(() => {
          renderMapCard()
          $('#week-chart').innerHTML = weekChart()
          closeTerm()
        }, 150)
      })

      /* ================================================================
       * Start
       * ================================================================ */
      renderAll()
      requestAnimationFrame(() => revealNow('#hero [data-reveal]'))
      if (S.source === 'live') loadLive()
      if (location.hash === '#advice') openAdvice('B')
    </script>
  </body>
</html>
